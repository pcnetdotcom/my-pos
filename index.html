<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart POS & Backoffice</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-semibold">🛒 AI Smart POS</h1>
            <p class="text-xs text-indigo-200">ระบบจัดการร้านค้าอัจฉริยะ</p>
        </div>
        <span class="bg-emerald-500 text-white text-xs px-2.5 py-1 rounded-full font-medium animate-pulse">Online</span>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4">
        
        <!-- Tab 1: POS หน้าขาย -->
        <section id="tab-pos" class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <label class="block text-sm font-medium text-slate-700 mb-2">สแกนหรือค้นหารหัสสินค้า</label>
                <div class="flex gap-2">
                    <input type="text" id="barcode-input" placeholder="พิมพ์บาร์โค้ด หรือใช้ AI สแกน" class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="openAiVision('pos')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-1 shadow-sm active:scale-95 transition">📸 AI สแกน</button>
                </div>
            </div>

            <!-- Cart Items -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-semibold text-slate-700 mb-3">รายการสินค้าในตะกร้า</h2>
                <div id="cart-list" class="divide-y divide-slate-100 max-h-60 overflow-y-auto mb-4">
                    <p class="text-xs text-slate-400 text-center py-4">ยังไม่มีสินค้าในตะกร้า</p>
                </div>
                <div class="border-t border-slate-100 pt-3 flex justify-between items-center mb-4">
                    <span class="font-medium text-slate-600">ยอดรวมทั้งสิ้น:</span>
                    <span id="cart-total" class="text-xl font-bold text-indigo-600">0.00 ฿</span>
                </div>
                <button onclick="checkout()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-medium shadow-sm hover:bg-emerald-700 active:scale-95 transition">ยืนยันการชำระเงิน</button>
            </div>
        </section>

        <!-- Tab 2: Stock จัดการสต็อก -->
        <section id="tab-stock" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center py-8">
                <h2 class="text-base font-semibold text-slate-700 mb-2">AI Smart Restock</h2>
                <p class="text-xs text-slate-400 mb-4">ถ่ายรูปป้ายสินค้าหรือบาร์โค้ดเพื่อเติมสต็อกอัตโนมัติ</p>
                <button onclick="openAiVision('restock')" class="bg-indigo-600 text-white px-6 py-3 rounded-xl text-sm font-medium shadow-sm active:scale-95 transition">📸 ถ่ายรูป AI เติมสต็อก</button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-sm font-semibold text-slate-700 mb-3">รายการสินค้าทั้งหมด</h3>
                <div id="product-list" class="space-y-2 max-h-96 overflow-y-auto">
                    <!-- รายการสินค้าดึงจาก Sheets -->
                </div>
            </div>
        </section>

        <!-- Tab 3: Dashboard รายงานกำไร -->
        <section id="tab-dashboard" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs text-slate-400 mb-1">ยอดขายรวม</p>
                    <h3 id="dash-revenue" class="text-lg font-bold text-indigo-600">0.00 ฿</h3>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs text-slate-400 mb-1">กำไรสุทธิ</p>
                    <h3 id="dash-profit" class="text-lg font-bold text-emerald-600">0.00 ฿</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-400 mb-1">จำนวนธุรกรรมทั้งหมด</p>
                <h3 id="dash-transactions" class="text-lg font-bold text-slate-700">0 รายการ</h3>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 py-3 flex justify-around shadow-lg z-50">
        <button onclick="switchTab('pos')" id="nav-pos" class="text-indigo-600 flex flex-col items-center text-xs font-medium">🛒 หน้าขาย</button>
        <button onclick="switchTab('stock')" id="nav-stock" class="text-slate-400 flex flex-col items-center text-xs font-medium">📦 สต็อกสินค้า</button>
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="text-slate-400 flex flex-col items-center text-xs font-medium">📊 กำไรสุทธิ</button>
    </nav>

    <!-- AI Vision Modal (Camera) -->
    <div id="ai-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-semibold text-slate-700">AI Vision Camera</h3>
                <button onclick="closeAiVision()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div class="relative bg-black rounded-2xl overflow-hidden aspect-square flex items-center justify-center">
                <video id="camera-preview" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="camera-canvas" class="hidden"></canvas>
            </div>
            <div class="flex gap-2">
                <button onclick="closeAiVision()" class="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl text-sm font-medium">ยกเลิก</button>
                <button onclick="captureAndSendAi()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-medium shadow-sm">ส่งประมวลผล AI</button>
            </div>
        </div>
    </div>

    <!-- Script ควบคุมระบบ -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyAVnteBtw-j5ECqjwbXXn-6lzo9O8E1cijdb4t8HYDN2GeuhyebK0IPwQcZBpFKAIW/exec";
        let products = [];
        let cart = [];
        let currentAiMode = 'pos';
        let mediaStream = null;

        window.onload = () => {
            fetchProducts();
            fetchDashboard();
        };

        function switchTab(tab) {
            ['pos', 'stock', 'dashboard'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "text-slate-400 flex flex-col items-center text-xs font-medium";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).className = "text-indigo-600 flex flex-col items-center text-xs font-medium";
            if(tab === 'dashboard') fetchDashboard();
            if(tab === 'stock') fetchProducts();
        }

        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}?action=getProducts`);
                const json = await res.json();
                if(json.status === 'success') {
                    products = json.data;
                    renderProductList();
                }
            } catch(err) { console.error(err); }
        }

        function renderProductList() {
            const container = document.getElementById('product-list');
            container.innerHTML = products.map(p => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm">
                    <div>
                        <p class="font-medium text-slate-700">${p.name}</p>
                        <p class="text-xs text-slate-400">บาร์โค้ด: ${p.barcode} | ราคา: ${p.price} ฿</p>
                    </div>
                    <span class="bg-indigo-50 text-indigo-600 font-semibold px-2.5 py-1 rounded-lg text-xs">เหลือ ${p.stock}</span>
                </div>
            `).join('');
        }

        async function fetchDashboard() {
            try {
                const res = await fetch(`${API_URL}?action=getDashboard`);
                const json = await res.json();
                if(json.status === 'success') {
                    document.getElementById('dash-revenue').innerText = json.summary.revenue.toLocaleString() + ' ฿';
                    document.getElementById('dash-profit').innerText = json.summary.profit.toLocaleString() + ' ฿';
                    document.getElementById('dash-transactions').innerText = json.summary.transactions + ' รายการ';
                }
            } catch(err) { console.error(err); }
        }

        // เปิดกล้อง AI Vision
        async function openAiVision(mode) {
            currentAiMode = mode;
            document.getElementById('ai-modal').classList.remove('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('camera-preview').srcObject = mediaStream;
            } catch(err) {
                alert('ไม่สามารถเปิดกล้องได้: ' + err.message);
                closeAiVision();
            }
        }

        function closeAiVision() {
            if(mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('ai-modal').classList.add('hidden');
        }

        async function captureAndSendAi() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('camera-canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];
            
            closeAiVision();
            alert('กำลังส่งภาพให้ AI ประมวลผล...');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'processAiVision', image: base64Image, mode: currentAiMode })
                });
                const json = await res.json();
                if(json.status === 'success') {
                    const code = json.barcode;
                    if(currentAiMode === 'pos') {
                        const prod = products.find(p => p.barcode === code || p.name.includes(code));
                        if(prod) {
                            addToCart(prod.barcode);
                        } else {
                            alert('AI อ่านได้ค่า "' + code + '" แต่ไม่พบในสต็อกสินค้า');
                        }
                    } else if(currentAiMode === 'restock') {
                        restockByAi(code);
                    }
                } else {
                    alert('AI อ่านภาพไม่ได้: ' + json.message);
                }
            } catch(err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ AI: ' + err.toString());
            }
        }

        async function restockByAi(barcode) {
            let qty = prompt("AI ตรวจพบบาร์โค้ด: " + barcode + "\nต้องการเพิ่มสต็อกจำนวนเท่าไหร่?", "10");
            if(!qty) return;
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'aiRestock', barcode: barcode, qty: Number(qty) })
                });
                const json = await res.json();
                if(json.status === 'success') {
                    alert(`เติมสต็อกสำเร็จ! สินค้า ${json.name} คงเหลือ ${json.newStock}`);
                    fetchProducts();
                } else {
                    alert(json.message);
                }
            } catch(err) { alert(err); }
        }

        function addToCart(barcode) {
            const prod = products.find(p => p.barcode === barcode);
            if(!prod) return alert('ไม่พบสินค้า');
            const item = cart.find(i => i.barcode === barcode);
            if(item) {
                item.qty += 1;
            } else {
                cart.push({ barcode: prod.barcode, name: prod.name, price: prod.price, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            if(cart.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">ยังไม่มีสินค้าในตะกร้า</p>`;
                document.getElementById('cart-total').innerText = '0.00 ฿';
                return;
            }
            let total = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += item.price * item.qty;
                return `
                    py-2 flex justify-between items-center text-sm">
                        <div>
                            <p class="font-medium text-slate-700">${item.name}</p>
                            <p class="text-xs text-slate-400">${item.price} ฿ x ${item.qty}</p>
                        </div>
                        <button onclick="cart.splice(${idx}, 1); renderCart();" class="text-rose-500 text-xs">ลบ</button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = total.toLocaleString() + ' ฿';
        }

        async function checkout() {
            if(cart.length === 0) return alert('ตะกร้าว่างเปล่า');
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'sell', items: cart })
                });
                const json = await res.json();
                if(json.status === 'success') {
                    alert(`ชำระเงินสำเร็จ! เลขที่บิล: ${json.saleID}\nยอดรวม: ${json.totalRevenue} ฿`);
                    cart = [];
                    renderCart();
                    fetchProducts();
                } else {
                    alert('เกิดข้อผิดพลาด: ' + json.message);
                }
            } catch(err) { alert(err); }
        }
    </script>
</body>
</html>
